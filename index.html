<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <script>
      // Polyfill de globalThis para WebView de Android antiguos (< Chrome 71), que si no
      // lanzan "globalThis is not defined" al cargar el bundle -> pantalla en blanco.
      // Debe ir ANTES que cualquier módulo. El resto de APIs modernas las cubre core-js.
      if (typeof globalThis === 'undefined') {
        (typeof self !== 'undefined' ? self : window).globalThis = typeof self !== 'undefined' ? self : window
      }
    </script>
    <script>
      // Anti-FOUC: aplica el tema guardado antes de que React monte.
      (function () {
        try {
          var t = localStorage.getItem('ul-theme') || 'dark'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.backgroundColor = dark ? '#0A0B0D' : '#F7F8FA'
        } catch (e) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.backgroundColor = '#0A0B0D'
        }
        // Safe areas para Android: env(safe-area-inset-*) no funciona en WebView.
        // Inyectamos CSS vars como fallback. Java los sobreescribirá con valores exactos.
        if (/android/i.test(navigator.userAgent)) {
          var r = document.documentElement.style
          r.setProperty('--sat', '48px')
          r.setProperty('--sab', '24px')
          r.setProperty('--sal', '0px')
          r.setProperty('--sar', '0px')
        }
      })()
    </script>
    <script>
      // Anti-FOUC del color de marca: aplica el acento de la última empresa antes de montar.
      (function () {
        try {
          var a = JSON.parse(localStorage.getItem('ul-brand-accent') || 'null')
          if (a && a.light && a.dark) {
            var s = document.createElement('style')
            s.id = 'brand-vars'
            s.textContent = ':root{--c-accent:' + a.light + ';} .dark{--c-accent:' + a.dark + ';}'
            document.head.appendChild(s)
          }
        } catch (e) {}
      })()
    </script>
    <!-- Favicon: variantes claro/oscuro según el tema del navegador -->
    <link rel="icon" type="image/png" href="/logo-light.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/logo-dark.png" />
    <title>Sapiens Telco Live · Gestión de flota</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
